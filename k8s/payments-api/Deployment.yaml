apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payments-api

  template:
    metadata:
      labels:
        app: payments-api

    spec:
      containers:
      - name: payments-api

        image: game-store-orchestration-payments-api:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: payments-api-config
              key: ASPNETCORE_ENVIRONMENT

        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: payments-api-config
              key: RABBITMQ_HOST

        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: payments-api-secret
              key: CONNECTION_STRING
