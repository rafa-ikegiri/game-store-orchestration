services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Senha@123456"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: redis
    
    ports:
      - "6379:6379"

  # ==================================================
  # Container do MongoDB
  # ==================================================
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  users-api:
    build:
      context: ../UsersAPI

    container_name: users-api

    ports:
      - "5001:8080"

    depends_on:
      - sqlserver
      - rabbitmq

    environment:
      ConnectionStrings__Database: Server=sqlserver,1433;Database=UsersDb;User Id=sa;Password=Senha@123456;TrustServerCertificate=True
      RABBITMQ_HOST: rabbitmq

  catalog-api:
    build:
      context: ../CatalogAPI

    container_name: catalog-api

    ports:
      - "5002:8080"

    depends_on:
      - sqlserver
      - rabbitmq
      - redis
      - mongodb

    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Senha@123456;TrustServerCertificate=True
      - ConnectionStrings__Database=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Senha@123456;TrustServerCertificate=True
      - ConnectionStrings__CatalogDbContext=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Senha@123456;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Mongo=mongodb://mongodb:27017
      - DatabaseName__Mongo=CatalogReviewsDb
      - RABBITMQ_HOST=rabbitmq

  payments-api:
    build:
      context: ../PaymentsAPI

    container_name: payments-api

    ports:
      - "5003:8080"

    depends_on:
      - sqlserver
      - rabbitmq

    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=PaymentsDb;User Id=sa;Password=Senha@123456;TrustServerCertificate=True
      RABBITMQ_HOST: rabbitmq

  notifications-api:
    build:
      context: ../NotificationsAPI

    container_name: notifications-api

    ports:
      - "5004:8080"

    depends_on:
      - rabbitmq

    environment:
      RABBITMQ_HOST: rabbitmq

  # ==================================================
  # Redis Insight (Interface Gráfica para o Redis)
  # ==================================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    restart: always

  # ==================================================
  # API Gateway (Kong em modo DB-less)
  # ==================================================
  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    depends_on:
      - users-api
      - catalog-api     

  # ==================================================
  # ADICIONADO: Prometheus para coleta de métricas
  # ==================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle' # <--- ISSO LIBERA O RELOAD VIA HTTP
    restart: always

  # ==================================================
  # ADICIONADO: Grafana para visualização dos dashboards
  # ==================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
  mongodb-data: